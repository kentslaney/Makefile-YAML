  git           :  "****-**-**"
  wordnet       :          "**"  # interchange-able with previous value
  iana          :          "**"
  w3            :  "*"
  "*"           :  "*"           # default: free fallthrough alias dependencies

make+src:
  hf:
    google+gemma-4-E4B-it:
  gh:
    kasper0406+gemma-coreml-chat:

ci+validated_cache_metadata:
  cache                    :
    utc+-_                 :  2026-10-18T02:05:20-0700
  hf                       :
    git+commit             :  411aa17b749aa952df1359d2dcea73917a544d9a
    utc+-_                 :  2026-07-15T09:40:09-0700
  "*"                      :
    git+commit             :  e68637e08404c8d232efe3f11298db4afff7d658
    utc+-_                 :  2026-10-18T01:50:20-0700
    ci+lint                :  ~
  arXiv                    :
    2104.09864             :  # [cs.CL]
      arXiv+alias          :  RoPE
      arXiv+v              :  5
      utc+-_               :  2023-11-08T06:36:32-0800
  gh                       :
    explosion+spacy        :
      git+commit           :  c2dabfc
    nektos+act             :
      git+commit           :  4f41128
    gfx-rs+wgpu            :
      git+commit           :  efcf445
  gopkg-v2                 :
