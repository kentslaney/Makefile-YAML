---

make+cache:
  git+commit: ~
  make+llm-docs:
    - iana+.well-known: "*"
      ci+cutoff:
      ci+validated_cache_metadata:
    - make+cache:
        git+commit:
        make+llm-docs:
      make+bootstrap:

make+bootstrap:
  - make+src: >-
      default-HuggingFace-hosted git-submodule with timestamp data via
      commit hook
    make+prng+salt:
      - default: null (`~`) to raise exceptions on JIT PRNG ops
      - make+prng+*+*+0x: >-
          initialization data to tile
        make+prng+*+repeats: >-
          number of times to repeat the data specified in `make+prng+*+*+0x`
        make+prng+0x:
          - empty string (`""`) gives default behavior
          - >-
            otherwise, overwrites StableHLO PRNG-op
            {BoE}[Bits of Entropy][{Wiki+en+Entropy_(information_theory)}]
            as defined by, e.g., a StableHLO graph
          - >-
            after the specified number of bytes,
            followed by the initialization data's number of repeats,
            the PRNG key split will lower {BoE} generation as normal
  
  - - >-
      add to git an initial implementation for bootstrap using `-fno-fast-math`
      and support for
    - - "{pypi+p+JAX}"
      - "{pypi+p+torch}"
      - "{w3+TR+WGSL} compute shaders"
    - "but primarily focused on {w3+TR+WebNN} integration"
    - >-
        even when the initial bootstrap prompt is underspecified,
        there should be a well-defined DAG input structure for the model
        implying a deterministic output which can iterate to self-consistency
    - >-
        the correct output should only depend on the interpretation of the prompt,
        so it should be possible to arrive at the fully-specified quine
        even without the initial model's implementation being persisted,
        which is good, because it should be a differently tuned model to
        respond to the unstructured first version
    - >-
        this implies that only the first model context for this bootstrap repo
        should encode the comments
        # does this fully specify a well-defined way to run it? no
        # if the compiler ends up specified to arrive at a correct implementation
        # that generates itself on making from source then it shouldn't matter.
        # imagine that I implemented everything correctly myself the first time,
        # but wanted to refactor to have the compiler produce itself.
    - >-
        if the first version doesn't hook up the section links, for example,
        the result should still structure the input in a way that allows
        topologically-sortable clarifications without destroying the cache's core compiler

  - - >-
        the stack should look like
    - - "{Wiki+en+WebAssembly} translation layer as applicable"
      - "{Wiki+en+Rust_(programming_language)}"
      - "{BPE}[{Wiki+en+Byte-pair_encoding}]"
      - "{arXiv+alias+RoPE} encoding"

  - >-
      add a linker stage to rewrite NLP inputs other than proper nouns into
      {Wiki+en+WordNet} vocabulary for
      (token/position)-friendly-(text notations) using
      ({Wiki+en+SpaCy}/notationally)-based-context before resuming {BPE}.
      Like LangChain in the sense of Munroe's "{Wiki+en+Thing_Explainer}".
  - - >-
      add support and usage examples for AI-guided operational transformations
      of cache data using git commits via github workflow from
    - - a noreply {Wiki+en+Hugging_Face} email for automated changes there
      - >-
        the git blame author for the changes' wildcard prefix
        representing loopback

  - >-
      structured output annotations logged on top of the YAML, for example:
    - - "which parts of the structured inputs have data dependencies that require rebuilding cache?"
    - >-
      any correctly formatted input should be assumed to have an associated implementation,
      but pipe logs to stderr and allow the user to stop running individual subgraphs

